<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTV Afterlife Bad Bunny - Shutdown</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
  }

  #mtvLogo {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 120px;
    z-index: 10;
  }

  #playBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 15px 30px;
    font-size: 26px;
    background: #ff0000;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    z-index: 10;
  }
</style>
</head>

<body>

<img id="mtvLogo" src="assets/images/mtv-badbunny.png">

<video id="video" playsinline loop></video>

<button id="playBtn">PLAY</button>

<script>
const video = document.getElementById("video");
const playBtn = document.getElementById("playBtn");

/* 📴 SHUTDOWN VIDEO */
const shutdown = "https://ia600907.us.archive.org/29/items/MTV-Afterlife-Bad-Bunny-Shutdown/VN20260412_181837.mp4";

/* ▶️ START */
playBtn.addEventListener("click", () => {
  playBtn.style.display = "none";
  video.src = shutdown;
  video.play();
});
</script>

</body>
</html>
